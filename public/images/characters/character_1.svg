<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D72" />
      <stop offset="50%" stop-color="#E83EFF" />
      <stop offset="100%" stop-color="#9B5CFF" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38E1FF" />
      <stop offset="100%" stop-color="#E83EFF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Aura Energy Behind -->
  <circle cx="200" cy="220" r="140" stroke="url(#neonPink)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" filter="url(#neonGlow)" />
  <circle cx="200" cy="220" r="170" stroke="#38E1FF" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.25" />

  <!-- Character Silhouette & Cybernetic Armor Structure (No Background) -->
  <g filter="url(#neonGlow)">
    <!-- Head / Hair Flow -->
    <path d="M140 180 C130 110, 170 80, 200 80 C230 80, 270 110, 260 180 C275 220, 290 280, 310 340 C285 300, 265 240, 255 200 C240 225, 220 230, 200 230 C180 230, 160 225, 145 200 C135 240, 115 300, 90 340 C110 280, 125 220, 140 180 Z" fill="url(#neonPink)" opacity="0.9" />

    <!-- Visor / Cybernetic Eyes -->
    <path d="M170 170 Q200 162 230 170 Q200 178 170 170 Z" fill="#38E1FF" />
    <circle cx="185" cy="170" r="4" fill="#FFFFFF" />
    <circle cx="215" cy="170" r="4" fill="#FFFFFF" />
    <line x1="150" y1="170" x2="250" y2="170" stroke="#E83EFF" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Neck & Tech Collar -->
    <path d="M185 220 L215 220 L220 260 L180 260 Z" fill="#160E24" stroke="url(#neonPink)" stroke-width="2" />
    <line x1="180" y1="240" x2="220" y2="240" stroke="#38E1FF" stroke-width="2" />

    <!-- Torso Cybernetic Frame -->
    <path d="M150 260 Q200 240 250 260 L270 380 Q200 420 130 380 Z" fill="#100B18" stroke="url(#neonPink)" stroke-width="2.5" />
    
    <!-- Chest Core (Mini Singularity) -->
    <circle cx="200" cy="310" r="18" fill="#07060B" stroke="#38E1FF" stroke-width="3" />
    <circle cx="200" cy="310" r="8" fill="#E83EFF" />
    <line x1="160" y1="310" x2="240" y2="310" stroke="#FF3D72" stroke-width="1.5" />

    <!-- Cyber Harness & Plate Accents -->
    <path d="M165 270 L190 300 L185 360 L155 350 Z" fill="url(#cyberCyan)" opacity="0.75" />
    <path d="M235 270 L210 300 L215 360 L245 350 Z" fill="url(#neonPink)" opacity="0.75" />

    <!-- Floating Holo Rings -->
    <ellipse cx="200" cy="400" rx="90" ry="24" stroke="#E83EFF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
    <ellipse cx="200" cy="430" rx="120" ry="32" stroke="#38E1FF" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4" />
  </g>
</svg>
