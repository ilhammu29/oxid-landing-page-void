<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF" />
      <stop offset="60%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#9B5CFF" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Quantum Geometric Field -->
  <polygon points="200,60 330,190 200,320 70,190" stroke="url(#cyanBlue)" stroke-width="2" stroke-dasharray="10 6" opacity="0.4" filter="url(#cyanGlow)" />
  <circle cx="200" cy="220" r="150" stroke="#E83EFF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />

  <g filter="url(#cyanGlow)">
    <!-- Sleek Tech Hair / Cowl -->
    <path d="M150 160 C140 100, 180 75, 200 75 C220 75, 260 100, 250 160 C265 190, 280 260, 295 330 C270 290, 255 240, 245 195 C235 220, 215 225, 200 225 C185 225, 165 220, 155 195 C145 240, 130 290, 105 330 C120 260, 135 190, 150 160 Z" fill="url(#cyanBlue)" opacity="0.95" />

    <!-- Quantum Hologram Mask -->
    <path d="M175 165 L225 165 L215 195 L185 195 Z" fill="#100B18" stroke="#38E1FF" stroke-width="2" />
    <circle cx="190" cy="180" r="3" fill="#38E1FF" />
    <circle cx="210" cy="180" r="3" fill="#38E1FF" />
    <line x1="160" y1="180" x2="240" y2="180" stroke="#00FFFF" stroke-width="1" />

    <!-- Collar & Quantum Exoskeleton -->
    <path d="M180 220 L220 220 L230 270 L170 270 Z" fill="#160E24" stroke="#38E1FF" stroke-width="2" />

    <!-- Chest Armor with Neon Cyan Lines -->
    <path d="M145 270 Q200 250 255 270 L280 400 Q200 440 120 400 Z" fill="#0C0814" stroke="url(#cyanBlue)" stroke-width="2.5" />
    
    <!-- Kinetic Battery Core -->
    <polygon points="200,290 220,325 200,345 180,325" fill="#38E1FF" opacity="0.9" />
    <line x1="150" y1="325" x2="250" y2="325" stroke="#38E1FF" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Exo Struts -->
    <path d="M160 280 L180 320 L170 380 L140 370 Z" fill="#38E1FF" opacity="0.4" />
    <path d="M240 280 L220 320 L230 380 L260 370 Z" fill="#38E1FF" opacity="0.4" />
  </g>
</svg>
