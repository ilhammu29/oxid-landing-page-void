<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="energyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="40%" stop-color="#FF3D72" />
      <stop offset="100%" stop-color="#E83EFF" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solar Solar Flare Halo -->
  <circle cx="200" cy="220" r="160" stroke="url(#energyGold)" stroke-width="2" stroke-dasharray="16 8" opacity="0.45" filter="url(#goldGlow)" />
  <circle cx="200" cy="220" r="130" stroke="#FF3D72" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />

  <g filter="url(#goldGlow)">
    <!-- Crown / Horns / Hair -->
    <path d="M140 170 C125 90, 165 60, 200 60 C235 60, 275 90, 260 170 C280 210, 305 280, 320 350 C290 310, 270 250, 255 200 C240 230, 220 235, 200 235 C180 235, 160 230, 145 200 C130 250, 110 310, 80 350 C95 280, 120 210, 140 170 Z" fill="url(#energyGold)" opacity="0.95" />

    <!-- Royal Cyber Diadem -->
    <polygon points="200,90 215,120 200,115 185,120" fill="#FFD700" />
    <path d="M170 175 Q200 168 230 175 Q200 182 170 175 Z" fill="#FFD700" />
    <circle cx="185" cy="175" r="3.5" fill="#FFFFFF" />
    <circle cx="215" cy="175" r="3.5" fill="#FFFFFF" />

    <!-- Cyber Armor Shoulders -->
    <path d="M120 250 L160 240 L165 280 L115 280 Z" fill="#FF3D72" opacity="0.8" />
    <path d="M280 250 L240 240 L235 280 L285 280 Z" fill="#FF3D72" opacity="0.8" />

    <!-- Torso Aegis -->
    <path d="M150 250 Q200 235 250 250 L275 390 Q200 430 125 390 Z" fill="#120A1C" stroke="url(#energyGold)" stroke-width="2.5" />

    <!-- Solar Nexus Core -->
    <circle cx="200" cy="305" r="16" fill="#07060B" stroke="#FFD700" stroke-width="3" />
    <circle cx="200" cy="305" r="7" fill="#FF3D72" />
    <line x1="165" y1="305" x2="235" y2="305" stroke="#FFD700" stroke-width="1.5" />

    <!-- Energy Wings / Shards -->
    <path d="M100 230 Q60 280 80 370 Q110 320 125 280 Z" fill="url(#energyGold)" opacity="0.6" />
    <path d="M300 230 Q340 280 320 370 Q290 320 275 280 Z" fill="url(#energyGold)" opacity="0.6" />
  </g>
</svg>
